name: Publishing

on:
  push:
    branches:
      - develop
      - hotfix/*
      - release/*
    tags:
      - v*.*.*

jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026
    environment: microsoft-store
    strategy:
      matrix:
        architecture:
          - x86
          - x64
          - arm64
        distribution:
          - app-store
          - standalone
        format:
          - msix
          - msi
        exclude:
          - distribution: app-store
            format: msi
          - distribution: standalone
            format: msix
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.architecture }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.architecture }}-nuget-

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Nuget packages
        run: |
          msbuild Fyreplace `
            /t:Restore `
            /p:Platform=${{ matrix.architecture }} `
            /p:PublishReadyToRun=true

      - name: Build app
        env:
          PackageName: ${{ vars.PACKAGE_NAME }}
          PackagePublisher: ${{ matrix.distribution == 'standalone' && vars.PACKAGE_PUBLISHER_STANDALONE || vars.PACKAGE_PUBLISHER  }}
          PackagePublisherName: ${{ vars.PACKAGE_PUBLISHER_NAME }}
          SentryDsn: ${{ matrix.distribution == 'app-store' && secrets.SENTRY_DSN || '' }}
          SentryOrg: ${{ matrix.distribution == 'app-store' && vars.SENTRY_ORG || '' }}
          SentryProject: ${{ matrix.distribution == 'app-store' && vars.SENTRY_PROJECT || '' }}
          SENTRY_AUTH_TOKEN: ${{ matrix.distribution == 'app-store' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          msbuild Fyreplace `
            /t:UpdateAppManifest `
            /t:UpdateAppxManifest `
            /p:Platform=${{ matrix.architecture }} `
            /p:Configuration=Release
          msbuild ${{ matrix.format == 'msix' && 'Fyreplace' || 'Fyreplace.Installer' }} `
            /t:Build `
            /p:Platform=${{ matrix.architecture }} `
            /p:Configuration=Release `
            /p:GenerateAppxPackageOnBuild=${{ matrix.format == 'msix' && 'true' || 'false' }} `
            /p:AppxPackageDir=AppPackages\ `
            /p:SDKSelfContained=${{ matrix.format == 'msi' && 'true' || 'false' }}

      - name: Simplify MSIX path
        if: ${{ matrix.format == 'msix' }}
        run: |
          ren .\Fyreplace\AppPackages\* Result
          ren .\Fyreplace\AppPackages\Result\*.msix Fyreplace.msix
          move .\Fyreplace\AppPackages\Result\Fyreplace.msix .\Deploy\

      - name: Simplify MSI path
        if: ${{ matrix.format == 'msi' }}
        run: |
          move .\Fyreplace.Installer\bin\${{ matrix.architecture }}\Release\en\Fyreplace.msi .\Deploy\

      - name: Upload MSIX
        if: ${{ matrix.distribution == 'app-store' }}
        uses: actions/upload-artifact@v6
        with:
          name: Fyreplace.${{ matrix.architecture }}.msix
          path: Deploy\Fyreplace.msix
          if-no-files-found: error

      - name: Upload ${{ matrix.format == 'msix' && 'MSIX' || 'MSI' }}
        if: ${{ matrix.distribution == 'standalone' }}
        uses: actions/upload-artifact@v6
        with:
          name: Fyreplace.${{ matrix.architecture }}.standalone.${{ matrix.format }}
          path: Deploy\Fyreplace.${{ matrix.format }}
          if-no-files-found: error

  test:
    name: Test
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        architecture:
          - x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.architecture }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.architecture }}-nuget-

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Nuget packages
        run: |
          msbuild Fyreplace.Tests `
            /t:Restore `
            /p:Platform=${{ matrix.architecture }}

      - name: Build app
        run: |
          msbuild Fyreplace.Tests `
            /t:Build `
            /p:Platform=${{ matrix.architecture }} `
            /p:Configuration=Debug

      - name: Run tests
        run: |
          .\vs vstest.console `
            Fyreplace.Tests\bin\${{ matrix.architecture }}\Debug\*\win-${{ matrix.architecture }}\Fyreplace.Tests.build.appxrecipe
